[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supersonic-sdk"
version = "0.1.0"
description = "Python SDK for SuperSonic Chat BI + Headless BI platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SuperSonic Team" }]
keywords = ["supersonic", "chat-bi", "headless-bi", "text2sql", "semantic-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
]
all = ["supersonic-sdk[pandas,cli,dev]"]

[project.scripts]
supersonic = "supersonic.cli.main:cli_main"

[project.urls]
Homepage = "https://github.com/tencentmusic/supersonic"
Repository = "https://github.com/tencentmusic/supersonic"

[tool.hatch.build.targets.wheel]
packages = ["src/supersonic"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF002", "RUF003", "RUF022"]  # 中文全角标点 + __all__ 按分类而非字母序

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real SuperSonic instance (skipped by default)",
]
addopts = "-m 'not integration' --cov=src/supersonic --cov-report=term-missing"
